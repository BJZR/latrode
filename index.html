<style>

html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}

.ov{position:fixed;inset:0;background:#0009;z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}

.sh{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}

.x{width:38px;height:38px;border-radius:50%;background:var(--sf2);font-size:18px}

.mu{color:var(--mu);font-size:14px}.er{color:var(--er)}
.al{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}

.sm{padding:7px 12px;border-radius:10px;background:var(--sf2);font-weight:600;font-size:14px}

:root{--ac:#111;--on:#fff;--bg:#f6f6f4;--bd:#d9d9d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#f2f2f2;--on:#0a0a0a;--bg:#0b0b0c;--sf:#131314;--sf2:#1b1b1d;--bd:#2c2c2f}}

*{border-radius:0!important}
.sw,.bd{border-radius:50%!important}
body{font-family:Jost,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400}
h1,h2,h3,.logo,.tot{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.02em}
header{display:grid;grid-template-columns:44px 1fr 44px;padding:4px 6px}
.logo{text-align:center;font-size:26px;letter-spacing:.34em;font-weight:700}
.ib{border:0;background:none;width:44px;height:44px}

.grid{grid-template-columns:repeat(2,1fr);gap:1px;padding:0 0 50px;max-width:none;background:var(--bd);border-top:1px solid var(--bd)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{border:0;background:var(--bg)}

.card .pr{font-size:14px;font-weight:400;margin-top:2px}
.dots i{width:9px;height:9px}
.empty{background:var(--bg);padding:40px 0}
.op,.qty,input,select,textarea,.ci,.note{border-width:1px}
.btn{font:500 15px Jost,sans-serif;letter-spacing:.14em}
.btn.g{background:var(--ac);color:var(--on)}
.sh{border:1px solid var(--bd)}
.mv{position:fixed;inset:0;background:#0007;z-index:50;display:none}
.mn{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--bg);border-right:1px solid var(--bd);z-index:51;transform:translateX(-102%);transition:transform .2s;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 14px;overflow:auto}

.chip{width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:none;padding:13px 0;font-weight:400}
.chip[aria-pressed=true]{background:none;color:var(--tx);font-weight:600;border-bottom-color:var(--tx)}
.mr{padding:14px 0;border-bottom:1px solid var(--bd);width:100%;text-align:left}
.seg{display:flex;border:1px solid var(--bd)}

#th,#gb{display:inline-flex;gap:8px;align-items:center}
.dl.nf button:last-child{font-style:normal}
.x{background:none;border:1px solid var(--bd);display:grid;place-items:center;padding:0}
.cb{width:22px;height:22px;border:1px solid var(--tx);display:grid;place-items:center;flex:none;padding:0;color:var(--on);background:transparent}
.cb[aria-checked=true]{background:var(--ac)}
.dd{margin-bottom:8px}
.dh{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--sf);border:1px solid var(--bd);padding:11px 12px;text-align:left}
.dl{border:1px solid var(--bd);border-top:0;background:var(--sf);max-height:220px;overflow:auto}
.dl[hidden]{display:none}
.dl button{display:block;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd)}
.dl button:last-child{border-bottom:0;font-style:italic}
@media(prefers-reduced-motion:reduce){.mn{transition:none}}

<script>
"use strict";

{id:"p1",n:"Camiseta Dry Fit",c:"Camisetas",pr:49900,d:"Tela liviana que seca rápido. Corte regular.",s:SH.Camisetas,co:C([["Negro","#15171c"],["Blanco","#f2f2f2"],["Azul","#2b4cff"]])},

<span class="lb">Talla</span><div class="opts">${p.s.map(s=>`<button class="op" aria-pressed="${sz===s}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
<span class="lb">Cantidad</span><div class="qty"><button data-q="-1" aria-label="Menos">−</button><b>${q}</b><button data-q="1" aria-label="Más">+</button></div>
<button class="btn" id="add" ${sz||!p.s.length?"":"disabled"}>${sz?"Agregar al carrito":"Elige una talla"}</button>`);
$("#cl").onclick=closeSh;
$("#sh").onclick=e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.co!==undefined){co=p.co[+t.dataset.co];draw()}
else if(t.dataset.s!==undefined){sz=t.dataset.s;draw()}
else if(t.dataset.q){q=Math.max(1,Math.min(20,q+ +t.dataset.q));draw()}
else if(t.id==="add"&&(sz||!p.s.length)){const k=CART.find(i=>i.pid===p.id&&i.s===sz&&i.c===(co&&co.n));
if(k)k.q+=q;else CART.push({id:Date.now()+"",pid:p.id,s:sz,c:co&&co.n,q,sel:true});
sv(K.k,CART);badge();closeSh();toast("Agregado al carrito")}}};
draw()}
/* carrito */
function badge(){$("#cn").textContent=CART.reduce((a,i)=>a+i.q,0)}
$("#ct").onclick=openCart;
function openCart(){CART=CART.filter(i=>P.some(p=>p.id===i.pid));
const sel=()=>CART.filter(i=>i.sel),tot=()=>sel().reduce((a,i)=>a+i.q*P.find(p=>p.id===i.pid).pr,0);
const f=ld("lt_cust",{n:"",t:"",a:"",o:""});
const draw=()=>{const items=CART.map(i=>{const p=P.find(x=>x.id===i.pid),h=(p.co.find(c=>c.n===i.c)||{}).h;
return `<div class="ci"><button class="cb" data-k="${i.id}" role="checkbox" aria-checked="${i.sel}" aria-label="Incluir en el pedido">${i.sel?IC('<path d="M5 12.5l4.5 4.5L19 7"/>',16):""}</button><img alt="" src="${art(p,h)}"><div class="d"><b>${esc(p.n)}</b><br><small>${esc([i.c,i.s&&"Talla "+i.s].filter(Boolean).join(" · "))}</small><br>${COP(p.pr*i.q)}</div>
<div class="qty"><button data-m="${i.id}" aria-label="Menos">−</button><b>${i.q}</b><button data-pl="${i.id}" aria-label="Más">+</button></div><button class="x" data-rm="${i.id}" aria-label="Quitar">${IC('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',18)}</button></div>`}).join("");
openSh(`<div class="row"><h2>Tu carrito</h2><button class="x" id="cl" aria-label="Cerrar">✕</button></div>
${CART.length?`<p class="mu" style="margin-top:6px">Marca los productos que quieres comprar ahora.</p>${items}
<div class="row" style="margin-top:16px"><span>Total (${sel().length} seleccionados)</span><span class="tot">${COP(tot())}</span></div>
<span class="lb">Datos de entrega</span>
<input id="cn1" placeholder="Nombre completo" autocomplete="name" value="${esc(f.n)}"><input id="cn2" type="tel" placeholder="Celular" autocomplete="tel" value="${esc(f.t)}">
<input id="cn3" placeholder="Dirección y ciudad" autocomplete="street-address" value="${esc(f.a)}"><textarea id="cn4" rows="2" placeholder="Notas (opcional)">${esc(f.o)}</textarea>
<div class="note"><b>Pago por Nequi</b><br>Envía el valor total al <b>${esc(CFG.nq)}</b> y manda el comprobante por WhatsApp. <button class="sm" id="cp">Copiar número</button></div>
<button class="btn g" id="go" ${sel().length?"":"disabled"}>Enviar pedido por WhatsApp</button><p class="mu er" id="er" style="margin-top:8px"></p>`:`<p class="empty">Tu carrito está vacío.</p>`}`);
$("#cl").onclick=closeSh;
const keep=()=>{if(!$("#cn1"))return;sv("lt_cust",{n:$("#cn1").value,t:$("#cn2").value,a:$("#cn3").value,o:$("#cn4").value})};
$("#sh").onchange=e=>{const k=e.target.dataset.k;if(k){CART.find(i=>i.id===k).sel=e.target.checked;sv(K.k,CART);keep();draw()}};
$("#sh").onclick=e=>{const t=e.target.closest("button");if(!t)return;const g=id=>CART.find(i=>i.id===id);keep();
if(t.dataset.k){const i=g(t.dataset.k);i.sel=!i.sel}
else if(t.dataset.m){const i=g(t.dataset.m);i.q=Math.max(1,i.q-1)}
else if(t.dataset.pl){const i=g(t.dataset.pl);i.q=Math.min(20,i.q+1)}
else if(t.dataset.rm){CART=CART.filter(i=>i.id!==t.dataset.rm)}
else if(t.id==="cp"){(navigator.clipboard?navigator.clipboard.writeText(CFG.nq):Promise.reject()).then(()=>toast("Número copiado"),()=>toast("Número: "+CFG.nq));return}
else if(t.id==="go"){send();return}else return;
sv(K.k,CART);badge();draw()};
$("#cn1")&&["cn1","cn2","cn3","cn4"].forEach(i=>$("#"+i).oninput=keep)};
const send=()=>{const n=$("#cn1").value.trim(),t=$("#cn2").value.trim(),a=$("#cn3").value.trim();
if(!n||!t||!a){$("#er").textContent="Completa nombre, celular y dirección.";return}
const L=sel().map(i=>{const p=P.find(x=>x.id===i.pid);return `• ${i.q} x ${p.n}${i.c?" | "+i.c:""}${i.s?" | Talla "+i.s:""} — ${COP(p.pr*i.q)}`});
const msg=`Hola Latrode, quiero hacer este pedido:\n\n${L.join("\n")}\n\nTotal: ${COP(tot())}\nPago: Nequi\n\nNombre: ${n}\nCelular: ${t}\nDirección: ${a}${$("#cn4").value.trim()?"\nNotas: "+$("#cn4").value.trim():""}`;
window.open(`https://wa.me/${CFG.wa.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`,"_blank");
CART=CART.filter(i=>!i.sel);sv(K.k,CART);badge();draw();toast("Pedido enviado. Paga por Nequi y manda el comprobante")};
draw()}
/* administración */
$("#ad").onclick=()=>{openSh('<div class="row"><h2>Administrador</h2><button class="x" id="cl" aria-label="Cerrar">✕</button></div><span class="lb">Ingresa tu PIN</span><input id="pn" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" placeholder="••••" style="text-align:center;letter-spacing:.5em;font-size:22px"><p class="mu er" id="pe"></p><button class="btn" id="pk">Entrar</button>');
$("#sh").onclick=null;$("#cl").onclick=closeSh;
const inp=$("#pn"),go=()=>{if(inp.value===CFG.pin)admin();else{$("#pe").textContent="PIN incorrecto";inp.value="";inp.focus()}};
$("#pk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"")};setTimeout(()=>inp.focus(),60)};
function admin(e){const ed=e?P.find(p=>p.id===e):{n:"",c:CATS[0],pr:"",d:"",s:SH[CATS[0]],co:[]};const isC=!CATS.includes(ed.c);
openSh(`<div class="row"><h2>Administrar</h2><button class="x" id="cl" aria-label="Cerrar">✕</button></div>
<span class="lb">${e?"Editar producto":"Nuevo producto"}</span>
<input id="an" placeholder="Nombre" value="${esc(ed.n)}">
<input type="hidden" id="ac" value="${isC?"Personalizado":esc(ed.c)}"><div class="dd"><button type="button" class="dh" id="acb" aria-expanded="false"><span id="acv">${isC?"Personalizado":esc(ed.c)}</span>${IC('<path d="M6 9l6 6 6-6"/>',16)}</button><div class="dl" id="acl" hidden>${[...CATS,"Personalizado"].map(c=>`<button type="button" data-o="${esc(c)}">${esc(c)}</button>`).join("")}</div></div><input id="acx" placeholder="¿Qué tipo de producto es? (ej. Guantes)" value="${isC?esc(ed.c):""}" ${isC?"":"hidden"}>
<span class="lb" style="margin-top:4px">Para</span><input type="hidden" id="ag" value="${ed.g||"u"}"><div class="dd"><button type="button" class="dh" id="agb" aria-expanded="false"><span id="agv">${GL[ed.g||"u"]}</span>${IC('<path d="M6 9l6 6 6-6"/>',16)}</button><div class="dl nf" id="agl" hidden>${["h","m","u"].map(c=>`<button type="button" data-go="${c}">${GL[c]}</button>`).join("")}</div></div>
<input id="ap" type="number" min="0" inputmode="numeric" placeholder="Precio en COP" value="${ed.pr}">
<textarea id="ad2" rows="2" placeholder="Descripción">${esc(ed.d||"")}</textarea>
<input id="as" placeholder="Tallas separadas por coma (S,M,L)" value="${esc(ed.s.join(","))}">
<input id="aco" placeholder="Colores: Negro:#111111, Azul:#2b4cff" value="${esc(ed.co.map(c=>c.n+":"+c.h).join(", "))}">
<label class="mu">Foto (opcional)</label><input id="af" type="file" accept="image/*">
<div class="row"><button class="btn" id="sa" style="margin-top:4px">${e?"Guardar cambios":"Agregar producto"}</button>${e?`<button class="btn s" id="nw" style="margin-top:4px">Cancelar</button>`:""}</div>
<span class="lb">Productos (${P.length})</span>
${P.map(p=>`<div class="al"><img alt="" src="${art(p)}"><span><b>${esc(p.n)}</b><br><small class="mu">${esc(p.c)} · ${GL[p.g||"u"]} · ${COP(p.pr)}</small></span><button class="sm" data-e="${p.id}">Editar</button><button class="sm" data-d="${p.id}">Borrar</button></div>`).join("")}
<span class="lb">Ajustes de la tienda</span>
<input id="cw" inputmode="numeric" placeholder="WhatsApp con indicativo (573001234567)" value="${esc(CFG.wa)}">
<input id="cq" inputmode="numeric" placeholder="Número Nequi" value="${esc(CFG.nq)}">
<input id="cpn" inputmode="numeric" pattern="[0-9]*" placeholder="PIN de administrador (solo números)" value="${esc(CFG.pin)}">
<button class="btn s" id="cs">Guardar ajustes</button>
<div class="row"><button class="btn s" id="ex">Exportar datos</button><button class="btn s" id="im">Importar datos</button></div>
<p class="mu" style="margin-top:10px">Los datos se guardan en este navegador. Exporta una copia para no perderlos.</p>`);
$("#cl").onclick=closeSh;
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>{const i=new Image();i.onload=()=>{const m=700,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.75))};i.src=x.result};x.readAsDataURL(f)});
$("#sh").onclick=async ev=>{const t=ev.target.closest("button");if(!t)return;
if(t.id==="agb"){const l=$("#agl");l.hidden=!l.hidden;t.setAttribute("aria-expanded",String(!l.hidden));return}
if(t.dataset.go){$("#ag").value=t.dataset.go;$("#agv").textContent=GL[t.dataset.go];$("#agl").hidden=true;$("#agb").setAttribute("aria-expanded","false");return}
if(t.id==="acb"){const l=$("#acl");l.hidden=!l.hidden;t.setAttribute("aria-expanded",String(!l.hidden));return}
if(t.dataset.o!==undefined){const v=t.dataset.o;$("#ac").value=v;$("#acv").textContent=v;$("#acl").hidden=true;$("#acb").setAttribute("aria-expanded","false");const x=$("#acx");x.hidden=v!=="Personalizado";if(v==="Personalizado")x.focus();else $("#as").value=SH[v].join(",");return}
if(t.dataset.e)return admin(t.dataset.e);
if(t.dataset.d){if(t.dataset.cf!=="1"){t.dataset.cf="1";t.textContent="¿Seguro?";t.style.color="var(--er)";return}P=P.filter(p=>p.id!==t.dataset.d);sv(K.p,P);refresh();admin();return}
if(t.id==="nw")return admin();
if(t.id==="sa"){const n=$("#an").value.trim(),pr=+$("#ap").value;if(!n||!(pr>0)){toast("Escribe nombre y precio");return}
const co=$("#aco").value.split(",").map(s=>s.trim()).filter(Boolean).map(s=>{const[a,b]=s.split(":");return{n:a.trim(),h:/^#[0-9a-f]{3,8}$/i.test((b||"").trim())?b.trim():"#888888"}});
const s=$("#as").value.split(",").map(x=>x.trim()).filter(Boolean);
const cv=$("#ac").value==="Personalizado"?$("#acx").value.trim():$("#ac").value;if(!cv){toast("Escribe el tipo de producto");return}
const o={id:e||"p"+Date.now(),n,c:cv,pr,d:$("#ad2").value.trim(),s:s.length?s:(SH[cv]||["Única"]),g:$("#ag").value,co,img:ed.img};
const f=$("#af").files[0];if(f)o.img=await rd(f);
if(e)P=P.map(p=>p.id===e?o:p);else P.unshift(o);
if(sv(K.p,P)){refresh();toast(e?"Cambios guardados":"Producto agregado");admin()}return}
if(t.id==="cs"){CFG={wa:$("#cw").value.trim(),nq:$("#cq").value.trim(),pin:$("#cpn").value.replace(/\D/g,"")||"1234"};sv(K.c,CFG);toast("Ajustes guardados");return}
if(t.id==="ex"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({P,CFG})],{type:"application/json"}));a.download="latrode-datos.json";a.click();return}
if(t.id==="im"){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!Array.isArray(d.P))throw 0;P=d.P;CFG=Object.assign(CFG,d.CFG||{});sv(K.p,P);sv(K.c,CFG);refresh();admin();toast("Datos importados")}catch(x){toast("Archivo no válido")}};i.click()}};
}
const GL={h:"Masculino",m:"Femenino",u:"Unisex"};
function refresh(){renderChips();renderGrid()}
refresh();badge();
const mo=o=>{$("#mn").classList.toggle("on",o);$("#mv").classList.toggle("on",o)};
$("#mb").onclick=()=>mo(true);$("#mx").onclick=$("#mv").onclick=()=>mo(false);
$("#mn").addEventListener("click",e=>{if(e.target.closest("#ad,.chip"))mo(false)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")mo(false)});
const GI={h:'<circle cx="10" cy="14" r="5"/><path d="M14 10l6-6M15 4h5v5"/>',m:'<circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6"/>',u:'<circle cx="12" cy="12" r="4"/><path d="M15 9l5-5M16 4h4v4M12 16v5M9.5 19h5"/>'},GO=["h","m","u"];
const gR=()=>{if(!GO.includes(gen))gen="u";$("#gb").innerHTML=IC(GI[gen],18)+"<span>"+GL[gen]+"</span>";$("#gb").title="Para: "+GL[gen]};
$("#gb").onclick=()=>{gen=GO[(GO.indexOf(gen)+1)%3];sv("lt_gen",gen);gR();renderGrid();toast("Para: "+GL[gen])};gR();
</script></body></html>
